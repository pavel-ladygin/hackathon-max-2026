name: CI/CD

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.sha }}

jobs:
  backend:
    name: Backend checks
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || (github.event.pull_request.merged == true && github.base_ref == 'dev' && contains(github.event.pull_request.labels.*.name, 'deploy-dev'))
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: max_together_test
          POSTGRES_USER: max_together
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U max_together -d max_together_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache: true
      - name: Test
        env:
          APP_ENV: test
          HTTP_ADDR: ':8080'
          LOG_LEVEL: info
          DATABASE_URL: postgres://max_together:ci-only-password@127.0.0.1:5432/max_together_test?sslmode=disable
          TEST_DATABASE_URL: postgres://max_together:ci-only-password@127.0.0.1:5432/max_together_test?sslmode=disable
        run: |
          go run ./cmd/migrate
          go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  contract:
    name: OpenAPI contract
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || (github.event.pull_request.merged == true && github.base_ref == 'dev' && contains(github.event.pull_request.labels.*.name, 'deploy-dev'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/tests/contract/requirements.txt
      - name: Install contract test dependencies
        run: python -m pip install -r backend/tests/contract/requirements.txt
        working-directory: .
      - name: Validate OpenAPI
        run: python -m unittest discover -s backend/tests/contract -v
        working-directory: .

  generated-contracts:
    name: Generated API types are current
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || (github.event.pull_request.merged == true && github.base_ref == 'dev' && contains(github.event.pull_request.labels.*.name, 'deploy-dev'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Check generated Go models
        run: |
          cp backend/internal/httpapi/openapi/types.gen.go /tmp/types.gen.go
          cd backend
          go generate ./internal/httpapi/openapi
          cmp internal/httpapi/openapi/types.gen.go /tmp/types.gen.go
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check generated TypeScript schema
        working-directory: frontend
        run: |
          npm ci
          cp src/shared/api/generated/schema.ts /tmp/schema.ts
          npm run generate:api
          cmp src/shared/api/generated/schema.ts /tmp/schema.ts

  frontend:
    name: Frontend checks
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || (github.event.pull_request.merged == true && github.base_ref == 'dev' && contains(github.event.pull_request.labels.*.name, 'deploy-dev'))
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check, test and build
        run: npm run check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/test-results
          if-no-files-found: ignore

  docker:
    name: Docker build and smoke test
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'deploy-dev'))
    runs-on: ubuntu-24.04
    needs: [backend, contract, generated-contracts, frontend]
    permissions:
      contents: read
    env:
      MAX_BOT_TOKEN: ci-dummy-token
      MAX_APP_URL: https://max.ru/t255_hakaton_max_bot
      INVITE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INVITE_ENCRYPTION_KEY_VERSION: "1"
      INVITE_URL_TEMPLATE: https://worknet.team/join/{token}
      MAX_DEEP_LINK_TEMPLATE: https://max.ru/t255_hakaton_max_bot?startapp={token}
      TICKET_PROVIDER_ALLOWLIST: tickets.example.invalid
      POSTGRES_PASSWORD: ci-only-password
      BACKEND_IMAGE: ci-backend:local
      FRONTEND_IMAGE: ci-frontend:local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Validate Compose configuration
        working-directory: .
        run: |
          docker compose config --quiet
          docker compose -f compose.production.yaml config --quiet
      - uses: docker/setup-buildx-action@v3.10.0
      - name: Build application images
        working-directory: .
        run: |
          docker build --pull --tag "$BACKEND_IMAGE" --file backend/Dockerfile .
          docker build --pull --tag "$FRONTEND_IMAGE" --file frontend/Dockerfile \
            --build-arg VITE_TICKET_PROVIDER_ALLOWLIST='*.ru' \
            frontend
      - name: Start smoke stack
        working-directory: .
        env:
          TICKET_PROVIDER_ALLOWLIST: tickets.example.invalid
        run: |
          docker compose up --detach --no-build postgres migrate backend
          docker run --detach --name ci-frontend --network max-together-foundation_default --publish 127.0.0.1:8081:80 ci-frontend:local
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:8081/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color backend migrate postgres
          docker logs ci-frontend
          exit 1
      - name: Smoke test frontend and API
        run: |
          curl --fail --silent http://127.0.0.1:8081/ >/dev/null
          curl --fail --silent http://127.0.0.1:8081/api/v1/health/ready >/dev/null
          curl --fail --silent http://127.0.0.1:8080/api/v1/health/ready >/dev/null
      - name: Scan application images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 
        with:
          image-ref: ci-backend:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ci-frontend:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Stop smoke stack
        if: always()
        working-directory: .
        run: |
          docker rm --force ci-frontend 2>/dev/null || true
          docker compose down --volumes

  secrets:
    name: Secret scan
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || (github.event.pull_request.merged == true && github.base_ref == 'dev' && contains(github.event.pull_request.labels.*.name, 'deploy-dev'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Scan repository for verified secrets
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 
        with:
          extra_args: --results=verified

  publish-and-deploy:
    name: Publish images and deploy
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.base_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'deploy-dev'))
    runs-on: ubuntu-24.04
    needs: [backend, contract, generated-contracts, frontend, docker, secrets]
    permissions:
      contents: read
      packages: write
    environment: production
    env:
      CHANNEL_TAG: ${{ github.event_name == 'pull_request' && 'dev' || 'main' }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: docker/setup-buildx-action@v3.10.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:${{ env.RELEASE_SHA }}
            ${{ env.IMAGE_PREFIX }}/backend:${{ env.CHANNEL_TAG }}
      - name: Build and push frontend
        uses: docker/build-push-action@v6.18.0
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_MAX_APP_URL=https://max.ru/t255_hakaton_max_bot
            VITE_YANDEX_MAPS_API_KEY=${{ secrets.YANDEX_MAPS_API_KEY }}
            VITE_TICKET_PROVIDER_ALLOWLIST=*.ru
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ env.RELEASE_SHA }}
            ${{ env.IMAGE_PREFIX }}/frontend:${{ env.CHANNEL_TAG }}
      - name: Deploy SHA to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST_KEY"
          [[ "$DEPLOY_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          key_file="$RUNNER_TEMP/deploy_key"
          known_hosts="$RUNNER_TEMP/deploy_known_hosts"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$known_hosts"
          ssh_options=(-i "$key_file" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts")
          scp "${ssh_options[@]}" compose.production.yaml deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/worknet/"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 0750 /opt/worknet/deploy.sh && /opt/worknet/deploy.sh '$DEPLOY_RELEASE_SHA'"
