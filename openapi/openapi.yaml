          type: string
          format: uuid
        matched_at:
          type: string
          format: date-time
        event:
          $ref: '#/components/schemas/EventCard'
        participants:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/PublicParticipant'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              enum:
              - UNAUTHENTICATED
              - TOKEN_EXPIRED
              - FORBIDDEN
              - VALIDATION_FAILED
              - NOT_FOUND
              - CONFLICT
              - IDEMPOTENCY_CONFLICT
              - ACTIVE_ROOM_EXISTS
              - RATE_LIMITED
              - ROOM_FULL
              - INVITE_EXPIRED
              - ROOM_EXPIRED
              - ROOM_NOT_READY
              - POOL_NOT_READY
              - POOL_EXHAUSTED
              - STALE_POOL_VERSION
              - INTENT_LOCKED
              - VOTE_ALREADY_CAST
              - ALREADY_MATCHED
              - ROUND_LIMIT_REACHED
              - EVENT_UNAVAILABLE
              - TICKETS_UNAVAILABLE
              - INTERNAL
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
              properties:
                current_pool_version:
                  type: integer
                  minimum: 1
                my_pool_finished:
                  type: boolean
                room_exhausted:
                  type: boolean
                field:
                  type: string
                fields:
                  type: array
                  items:
                    type: object
                    required:
                    - field
                    - reason
                    properties:
                      field:
                        type: string
                      reason:
                        type: string
                active_room:
                  anyOf:
                  - $ref: '#/components/schemas/RoomSummary'
                  - type: 'null'
                match:
                  anyOf:
                  - $ref: '#/components/schemas/MatchSummary'
                  - type: 'null'
