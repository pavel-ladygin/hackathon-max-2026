      - dates
      - day_types
      - time_slots
      - category_slugs
      - budget_max_minor
      - exclusion_slugs
      - version
      - round_no
      - submitted_at
      properties:
        dates:
          type: array
          minItems: 1
          maxItems: 14
          uniqueItems: true
          items:
            type: string
            format: date
        day_types:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DayType'
          description: Пустой массив означает любой день; значения объединяются OR
        time_slots:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TimeSlot'
          description: Пустой массив означает любое время; значения объединяются OR
        category_slugs:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CategorySlug'
        budget_max_minor:
          type: integer
          minimum: 0
          maximum: 100000000
        radius_m:
          type:
          - integer
          - 'null'
          minimum: 100
          maximum: 50000
          description: Значение null отключает фильтр расстояния. Если заданы координаты location, расстояние считается от них; иначе — от центра города комнаты.
        exclusion_slugs:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
            - nightclubs
            - very_loud
            - outdoor
            - far_from_metro
        location:
          anyOf:
          - $ref: '#/components/schemas/GeoPoint'
          - type: 'null'
          description: При заданном radius это поле задаёт точку отсчёта. Значение null вместе с радиусом означает центр города комнаты. Координаты не сохраняются дольше, чем это требуется для ранжирования.
        free_text:
          type:
          - string
          - 'null'
          maxLength: 300
        version:
          type: integer
          minimum: 1
        round_no:
          type: integer
          minimum: 1
          maximum: 3
        submitted_at:
          type: string
          format: date-time
    PoolSummary:
      type: object
      required:
      - version
      - round_no
      - state
      - total
      - is_small
      - voted_by_me
      - my_pool_finished
      - room_exhausted
      properties:
        version:
          type: integer
          minimum: 1
        round_no:
          type: integer
          minimum: 1
          maximum: 3
        state:
          type: string
          enum:
          - ranking
          - ready
          - exhausted
        total:
          type: integer
          minimum: 0
        voted_by_me:
          type: integer
          minimum: 0
        my_pool_finished:
          type: boolean
          description: Текущий участник проголосовал по всем доступным карточкам
        room_exhausted:
          type: boolean
          description: Оба участника просмотрели текущий пул без совпадения.
        retry_after_seconds:
          type:
          - integer
          - 'null'
          minimum: 1
        exhaustion_reasons:
          type: array
          description: Только агрегированные причины без чужих данных
          items:
            type: object
            required:
            - code
            - text
            properties:
              code:
                type: string
                enum:
                - budget
                - date
                - categories
                - radius
                - catalog_shortage
              text:
                type: string
        is_small:
          type: boolean
          description: Значение true означает, что в пуле доступно только одно или два события.
    RoomEventsResponse:
      type: object
      required:
      - room_id
      - pool_version
      - round_no
      - items
      - next_cursor
      - total
      properties:
        room_id:
          type: string
          format: uuid
        pool_version:
          type: integer
          minimum: 1
        round_no:
          type: integer
          minimum: 1
          maximum: 3
        items:
          type: array
          items:
            type: object
            required:
            - cursor
            - position
            - event
            properties:
              cursor:
                type: string
                description: Указатель следующей страницы; не передавайте его в запросе vote.
              position:
                type: integer
                minimum: 0
              event:
                $ref: '#/components/schemas/EventCard'
        next_cursor:
          type:
          - string
          - 'null'
        total:
          type: integer
          minimum: 0
    VoteRequest:
      type: object
      additionalProperties: false
      required:
      - pool_version
      - vote
      properties:
        pool_version:
          type: integer
          minimum: 1
        vote:
          $ref: '#/components/schemas/VoteValue'
    VoteResponse:
      type: object
      required:
      - accepted_vote
      - pool_version
      - my_pool_finished
      - room_exhausted
      - match
      properties:
        accepted_vote:
          $ref: '#/components/schemas/VoteValue'
        pool_version:
          type: integer
          minimum: 1
        my_pool_finished:
          type: boolean
        room_exhausted:
          type: boolean
        match:
          anyOf:
          - $ref: '#/components/schemas/Match'
          - type: 'null'
    MatchSummary:
      type: object
      required:
      - id
      - room_id
      - event_id
      - matched_at
      - participants
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        matched_at:
          type: string
          format: date-time
        participants:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/PublicParticipant'
          description: Передаются только безопасные поля display_name, avatar и role. Идентификатор MAX и условия подбора не раскрываются.
    Match:
      type: object
      required:
      - id
      - matched_at
      - event
      - participants
      properties:
        id:
          type: string
          format: uuid
        matched_at:
          type: string
          format: date-time
        event:
          $ref: '#/components/schemas/EventCard'
        participants:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/PublicParticipant'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              enum:
              - UNAUTHENTICATED
              - TOKEN_EXPIRED
              - FORBIDDEN
              - VALIDATION_FAILED
              - NOT_FOUND
              - CONFLICT
              - IDEMPOTENCY_CONFLICT
              - ACTIVE_ROOM_EXISTS
              - RATE_LIMITED
              - ROOM_FULL
              - INVITE_EXPIRED
              - ROOM_EXPIRED
              - ROOM_NOT_READY
              - POOL_NOT_READY
              - POOL_EXHAUSTED
              - STALE_POOL_VERSION
              - INTENT_LOCKED
              - VOTE_ALREADY_CAST
              - ALREADY_MATCHED
              - ROUND_LIMIT_REACHED
              - EVENT_UNAVAILABLE
              - TICKETS_UNAVAILABLE
              - INTERNAL
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
              properties:
                current_pool_version:
                  type: integer
                  minimum: 1
                my_pool_finished:
                  type: boolean
                room_exhausted:
                  type: boolean
                field:
                  type: string
                fields:
                  type: array
                  items:
                    type: object
                    required:
                    - field
                    - reason
                    properties:
                      field:
                        type: string
                      reason:
                        type: string
                active_room:
                  anyOf:
                  - $ref: '#/components/schemas/RoomSummary'
                  - type: 'null'
                match:
                  anyOf:
                  - $ref: '#/components/schemas/MatchSummary'
                  - type: 'null'
