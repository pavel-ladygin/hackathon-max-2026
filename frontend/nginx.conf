server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep browser capabilities limited to this app, MAX, the Yandex Maps API,
    # our API and the explicitly approved event-image provider. The Yandex API
    # requires unsafe-eval for its runtime; no other script origin is allowed.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-eval' https://st.max.ru https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; connect-src 'self' https://*.max.ru https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net; style-src 'self' 'unsafe-inline' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; img-src 'self' data: https://images.unsplash.com https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://yastatic.net; worker-src 'self' data: blob: https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; frame-ancestors 'self' https://max.ru https://*.max.ru" always;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
