services:
  timepad-image-recovery:
    profiles: ["maintenance"]
    image: ${BACKFILL_IMAGE:-max-together-backfill:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: maintenance
    command: ["/app/backfill-timepad-posters", "--limit", "50"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: "postgres://${POSTGRES_USER:-max_together}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-max_together}?sslmode=disable"
      TIMEPAD_BASE_URL: ${TIMEPAD_BASE_URL:-https://api.timepad.ru/v1}
      TIMEPAD_TOKEN: ${TIMEPAD_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    stop_grace_period: 15s
