# Install as /etc/nginx/sites-available/worknet.team.conf and enable it.
server {
    listen 80;
    listen [::]:80;
    server_name worknet.team www.worknet.team;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://worknet.team$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.worknet.team;
    ssl_certificate /etc/letsencrypt/live/worknet.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worknet.team/privkey.pem;
    return 301 https://worknet.team$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name worknet.team;
    ssl_certificate /etc/letsencrypt/live/worknet.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worknet.team/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-eval' https://st.max.ru https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; connect-src 'self' https://*.max.ru https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net; style-src 'self' 'unsafe-inline' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; img-src 'self' data: https://images.unsplash.com https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://yastatic.net; worker-src 'self' data: blob: https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; frame-ancestors 'self' https://max.ru https://*.max.ru" always;
    client_max_body_size 2m;

    location /api/v1/auth/max/bootstrap {
        limit_req zone=max_bootstrap burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/worknet-proxy.conf;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/worknet-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/snippets/worknet-proxy.conf;
    }
}
