name: max-together-production

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-max_together}
      POSTGRES_USER: ${POSTGRES_USER:-max_together}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    command: ["/app/migrate"]
    environment: &backend_environment
      APP_ENV: production
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: "postgres://${POSTGRES_USER:-max_together}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-max_together}?sslmode=disable"
      MAX_INIT_DATA_MAX_AGE: ${MAX_INIT_DATA_MAX_AGE:-1h}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    environment:
      <<: *backend_environment
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?MAX_BOT_TOKEN is required}
      INTERNAL_ADMIN_PROXY_SECRET: ${INTERNAL_ADMIN_PROXY_SECRET:-}
      INVITE_ENCRYPTION_KEY: ${INVITE_ENCRYPTION_KEY:?INVITE_ENCRYPTION_KEY is required}
      INVITE_ENCRYPTION_KEY_VERSION: ${INVITE_ENCRYPTION_KEY_VERSION:-1}
      INVITE_URL_TEMPLATE: ${INVITE_URL_TEMPLATE:?INVITE_URL_TEMPLATE is required}
      MAX_DEEP_LINK_TEMPLATE: ${MAX_DEEP_LINK_TEMPLATE:?MAX_DEEP_LINK_TEMPLATE is required}
      TICKET_PROVIDER_ALLOWLIST: ${TICKET_PROVIDER_ALLOWLIST:?TICKET_PROVIDER_ALLOWLIST is required}
      REG_S3_ENDPOINT: ${REG_S3_ENDPOINT:-https://s3.regru.cloud}
      REG_S3_REGION: ${REG_S3_REGION:-us-east-1}
      REG_S3_BUCKET: ${REG_S3_BUCKET:-}
      REG_S3_ACCESS_KEY_ID: ${REG_S3_ACCESS_KEY_ID:-}
      REG_S3_SECRET_ACCESS_KEY: ${REG_S3_SECRET_ACCESS_KEY:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 15s

  event-sync:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    command: ["/app/event-sync"]
    environment: &event_sync_environment
      <<: *backend_environment
      INVITE_ENCRYPTION_KEY: ${INVITE_ENCRYPTION_KEY:?INVITE_ENCRYPTION_KEY is required}
      INVITE_ENCRYPTION_KEY_VERSION: ${INVITE_ENCRYPTION_KEY_VERSION:-1}
      KUDAGO_BASE_URL: ${KUDAGO_BASE_URL:-https://kudago.com/public-api/v1.4}
      KUDAGO_TIMEOUT: ${KUDAGO_TIMEOUT:-30s}
      KUDAGO_LOCATION: ${KUDAGO_LOCATION:-msk}
      KUDAGO_PAGE_SIZE: ${KUDAGO_PAGE_SIZE:-100}
      KUDAGO_MAX_REQUESTS_PER_MINUTE: ${KUDAGO_MAX_REQUESTS_PER_MINUTE:-6}
      EVENT_SYNC_PROVIDER: ${EVENT_SYNC_PROVIDER:-}
      EVENT_SYNC_CITY_ID: ${EVENT_SYNC_CITY_ID:-a0f625ee-2154-5a45-8afe-37adf955ec24}
      EVENT_SYNC_CITY_PROFILES: ${EVENT_SYNC_CITY_PROFILES:-}
      TIMEPAD_CITY_NAME: ${TIMEPAD_CITY_NAME:-Москва}
      TIMEPAD_UPSERT_ONLY: ${TIMEPAD_UPSERT_ONLY:-true}
      EVENT_SYNC_INTERVAL: ${EVENT_SYNC_INTERVAL:-2h}
      EVENT_SYNC_RUN_ON_START: ${EVENT_SYNC_RUN_ON_START:-false}
      TIMEPAD_BASE_URL: ${TIMEPAD_BASE_URL:-https://api.timepad.ru/v1}
      TIMEPAD_TOKEN: ${TIMEPAD_TOKEN:-}
      TIMEPAD_TIMEOUT: ${TIMEPAD_TIMEOUT:-30s}
      TIMEPAD_PAGE_SIZE: ${TIMEPAD_PAGE_SIZE:-100}
      TIMEPAD_MAX_REQUESTS_PER_MINUTE: ${TIMEPAD_MAX_REQUESTS_PER_MINUTE:-20}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

  # Same automatic worker and interval; only Timepad, explicit opt-in profile.
  event-sync-timepad-spb:
    profiles: ["spb"]
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    command: ["/app/event-sync"]
    environment:
      <<: *event_sync_environment
      EVENT_SYNC_PROVIDER: timepad
      EVENT_SYNC_CITY_ID: bf61fbf5-8c5b-53da-96c7-3560df3f8177
      KUDAGO_LOCATION: spb
      TIMEPAD_CITY_NAME: Санкт-Петербург
      TIMEPAD_UPSERT_ONLY: ${SPB_TIMEPAD_UPSERT_ONLY:-true}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

  daily-notifications:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    command: ["/app/daily-notifications"]
    environment:
      <<: *backend_environment
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?MAX_BOT_TOKEN is required}
      MAX_APP_URL: ${MAX_APP_URL:?MAX_APP_URL is required; set it to the public MAX bot URL}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
